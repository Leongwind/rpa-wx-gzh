interface:
  display_name: "WeChat MP Publisher"
  short_description: "Create dynamic WeChat article drafts or publications"
  default_prompt: "Turn the user's requested title, body, and local or attached images into a WeChat Official Account article. Create a draft by default; publish only after explicit confirmation, using the official API when configured or the isolated Playwright session otherwise. Show QR codes in the conversation and report only verified results."
